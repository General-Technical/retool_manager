STAGING_SPECIFIC_VERSION=""
DEV_SPECIFIC_VERSION=""

# Backup Configuration
BACKUP_DIR="/opt/retool-backups"
MAX_BACKUPS=10  # Number of backups to keep per environment

# Logging Configuration
LOG_DIR="/var/log/retool"

# Docker Secret Configuration
RETOOL_API_KEY_SECRET="SSOP_b54ac4a1-9309-404f-a65e-7bc832bdaa18"

# Environment Enablement
USE_PROD_ENV="true"
USE_STAGING_ENV="true"
USE_DEV_ENV="true"
